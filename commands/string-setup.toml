description = "Set up String Web Access — check the connection and confirm fetch, search, and product help respond."
prompt = """Verify that String Web Access is configured and working.

1. Confirm the API key setting is present. If it is missing, tell the user to create a key at https://portal.usestring.ai and run `gemini extensions config string-web-access`, then stop.

2. Check the connection with the cheapest possible call — fetch `https://example.com` and confirm Markdown comes back.

3. Run one search for a simple query and confirm structured results come back with title, url and snippet.

4. Ask product help what String Web Access does and confirm documentation excerpts come back with source URLs.

5. Report which tools responded, and what to do next if any failed:
   - Fetch and search both empty or erroring → the key is likely invalid or unset
   - Product help fails → report that error separately; it reads public docs without sending the key
   - Do not retry failures in a loop

Keep it to a few lines. This is a connectivity check, not a demo.
"""
